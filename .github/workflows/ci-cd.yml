# GitHub Actions CI/CD pipeline definition
# Add jobs for build, test, deploy as needed
name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install pytest flake8

      - name: Run tests
        run: pytest

      - name: Lint code
        run: flake8 app/

      - name: Build Docker image
        run: |
          docker build -t predictops:latest .

      - name: Push Docker image
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker tag predictops:latest rabelmervin/predictops:latest
          docker push rabelmervin/predictops:latest

      - name: Notify Argo CD
        if: success()
        run: |
          curl -X POST https://${{ secrets.ARGO_CD_SERVER }}/api/v1/applications/predictops/sync \
            -H "Authorization: Bearer ${{ secrets.ARGO_CD_TOKEN }}" \
            -H "Content-Type: application/json"
        continue-on-error: true