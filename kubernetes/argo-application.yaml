apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: predictops
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/rabelmervin/PredictOps.git'
    targetRevision: HEAD
    path: kubernetes
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=background
      - RespectIgnoreDifferences=true
  revisionHistoryLimit: 10
  info:
    - name: 'Documentation'
      value: 'https://github.com/rabelmervin/PredictOps/blob/main/TESTING_GUIDE.md'
    - name: 'GitHub Repository'
      value: 'https://github.com/rabelmervin/PredictOps'
