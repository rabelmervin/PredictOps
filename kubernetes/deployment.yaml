apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictops-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: predictops-app
  template:
    metadata:
      labels:
        app: predictops-app
    spec:
      containers:
      - name: predictops-app
        image: localhost:5000/predictops:latest
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10